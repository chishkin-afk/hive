version: '3'

dotenv: [ ./backend/.env ]

# global env variables
env:
  BACKEND_CMD_PATH: ./cmd/server/main.go

# set the validation params
vars:
  ALLOWED_ENVS: [dev, staging, prod]
  JWT_PRIVATE_PATH: ./keys/jwtRS256.key
  JWT_PUBLIC_PATH: ./keys/jwtRS256.key.pub

# main tasks
tasks:
  # run the backend service
  brun:
    requires:
      vars:
        - name: APP_CONFIG_PATH
        - name: APP_ENV
          enum:
            ref: .ALLOWED_ENVS
    dir: ./backend
    preconditions:
      - go test ./...
    cmds:
      - go run $BACKEND_CMD_PATH
  
  # generate jwt keys on backend
  jwt-keys:
    dir: ./backend
    preconditions:
      - mkdir -p ./keys/
    cmds:
      - openssl genrsa -out {{.JWT_PRIVATE_PATH}} 2048
      - openssl rsa -in {{.JWT_PRIVATE_PATH}} -pubout -out {{.JWT_PUBLIC_PATH}}
  
  # quick start the backend
  qstart:
    dir: .
    cmds:
      - cp -n ./backend/.env.example ./backend/.env || true
      - task: jwt-keys
      - docker-compose --env-file ./backend/.env up -d