name: Linters
on: [push]
jobs:
  Backend-Linter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout The Repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Start Linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: ./backend

  Frontend-Linter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout The Repository
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Check prettier formatter
        run: npm run format:check
