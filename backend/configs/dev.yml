app:
  name: hive-crm
  version: 0.0.2
  env: ${APP_ENV}

server:
  http:
    addr: localhost:8090
    tls:
      enable: false 
      server_cert_path: ./certs/server.crt
      server_key_path: ./certs/server.key
  conns:
    read_timeout: 10s
    write_timeout: 10s
    idle_timeout: 30s

persistence:
  postgres:
    migrations_path: ./migrations
    host: ${POSTGRES_HOST}
    port: ${POSTGRES_PORT}
    sslmode: disable
    auth:
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      dbname: ${POSTGRES_DB}
    conns:
      max_idles: 15
      max_idle_time: 30m
      max_opens: 5
      max_lifetime: 15m

cache:
  user_ttl: 5m
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    auth:
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      db: ${REDIS_DB}

authorization:
  jwt:
    token_ttl: 168h
    private_key_path: ./jwtRS256.key
    public_key_path: ./jwtRS256.key.pub