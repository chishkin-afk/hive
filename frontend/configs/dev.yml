app:
  name: hive-crm-frontend
  version: 0.0.1
  env: ${APP_ENV}

middlewares:
  rate_limit:
    window: 1m
    limit: 100

server:
  http:
    addr: ${HTTP_ADDR}
    tls:
      enable: false
      server_cert_path: ./certs/server.crt
      server_key_path: ./certs/server.key
  conns: 
    read_timeout: 2s
    write_timeout: 2s
    idle_timeout: 30s

backend:
  base_url: ${BACKEND_BASE_URL}