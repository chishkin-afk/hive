                    <a class="island-link" href="#pricing">Тарифы</a>
                    <a class="island-link" href="#faq">FAQ</a>
                </div>

                <div class="island-divider" role="separator"></div>

                <div class="island-actions">
                    <a class="island-btn" href="/auth?action=login">Войти</a>
                    <a class="island-btn island-btn-primary" href="/auth?action=register">Регистрация</a>
                </div>

                <button class="burger-btn" id="burgerBtn" aria-label="Меню">

                    <path d="M2 12H3"
                        stroke-width="2" stroke-linecap="round"/>

                        stroke-width="2" stroke-linecap="round"/>

        <div id="mobileMenuOverflow" class="mobile-menu-overflow">
            <nav class="mobile-menu">
                <div class="menu-links">
                    <a class="menu-link" href="#features">Возможности</a>
                    <a class="menu-link" href="#pricing">Тарифы</a>
                    <a class="menu-link" href="#faq">FAQ</a>

                    <a class="menu-btn" href="/auth?action=login">Войти</a>
                    <a class="menu-btn menu-btn-primary" href="/auth?action=register">Регистрация</a>
