{{define "base"}}
<!DOCTYPE html>
<html lang="en">
    {{template "head" .}}
<body>
    {{if eq .page "landing"}}
        {{template "landing_content" .}}
    {{else if eq .page "auth"}}
        {{template "auth_content" .}}
    {{else if eq .page "appointment"}}
        {{template "appointment_content" .}}
    {{end}}

    {{template "scripts" .}}
</body>
</html>
{{end}}
