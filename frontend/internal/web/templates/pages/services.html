{{define "services_extra_head"}}
<link rel="stylesheet" href="/static/css/header.css">
<link rel="stylesheet" href="/static/css/services.css">
<link rel="stylesheet" href="/static/css/keyframes.css">
<link rel="stylesheet" href="/static/css/footer.css">
{{end}}

{{define "services_content"}}
{{template "header" .}}
<div class="container">
    <div class="services-header">
        <h1 class="services-title">Твои услуги</h1>
        <p class="services-subtitle">Можешь настраивать их</p>
    </div>

    <div class="services-list" id="servicesList">
        <!-- Карточки будут загружены динамически -->
    </div>
    
    <div class="pagination" id="pagination">
        <button class="pagination-btn" id="backBtn">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 6L9 12L15 18"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <div class="pagination-info">
            <span id="currentPage">—</span> из <span id="totalPages">—</span>
        </div>
        <button class="pagination-btn" id="forwardBtn">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M9 18L15 12L9 6"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>

    <div id="serviceModalOverlay" class="service-modal-overlay">
        <div class="service-modal">
            <div class="service-modal-top">
                <div class="service-modal-main">
                    <label>
                        <span class="service-modal-input-title">Название</span>
                        <input id="editServiceTitle" type="text">
                    </label>
                    <label>
                        <span class="service-modal-input-title">Описание</span>
                        <textarea id="editServiceDescription"></textarea>
                    </label>
                    <label>
                        <span class="service-modal-input-title">Цена</span>
                        <div class="service-modal-input-wrapper">
                            <input id="editServicePrice" type="number">
                            <span class="service-modal-input-suffix">₽</span>
                        </div>
                    </label>
                    <label>
                        <span class="service-modal-input-title">Продолжительность</span>
                        <div class="service-modal-input-wrapper">
                            <input id="editServiceDuration" type="number">
                            <span class="service-modal-input-suffix">мин</span>
                        </div>
                    </label>
                    <label>
                        <span class="service-modal-input-title">Интервал между записями</span>
                        <div class="service-modal-input-wrapper">
                            <input id="editServiceInterval" type="number">
                            <span class="service-modal-input-suffix">мин</span>
                        </div>
                    </label>
                </div>
    
                <div class="service-divider"></div>
                
                <div class="service-modal-buttons">
                    <button id="saveEditServiceBtn" class="service-modal-btn">Сохранить</button>
                    <button id="suspendServiceBtn" class="service-modal-btn">Приостановить</button>
                    <button id="resumeServiceBtn" class="service-modal-btn">Возобновить</button>
                    <button id="copyURLServiceBtn" class="service-modal-btn">Ссылка</button>
                    <button id="deleteServiceBtn" class="service-modal-btn delete">Удалить</button>
                </div>
            </div>

            <div class="service-modal-bottom">
                <h2>Записи</h2>

                <div class="bookings-list" id="editBookingsList">
                    <!-- Записи будут загружены динамически -->
                </div>
            </div>
        </div>
    </div>

    <div id="serviceCreateModalOverlay" class="service-modal-overlay">
        <div class="service-modal">
            <div class="service-modal-top">
                <div class="service-modal-main">
                    <label>
                        <span class="service-modal-input-title">Название</span>
                        <input id="createServiceTitle" type="text">
                    </label>
                    <label>
                        <span class="service-modal-input-title">Описание</span>
                        <textarea id="createServiceDescription"></textarea>
                    </label>
                    <label>
                        <span class="service-modal-input-title">Цена</span>
                        <div class="service-modal-input-wrapper">
                            <input id="createServicePrice" type="number">
                            <span class="service-modal-input-suffix">₽</span>
                        </div>
                    </label>
                    <label>
                        <span class="service-modal-input-title">Продолжительность</span>
                        <div class="service-modal-input-wrapper">
                            <input id="createServiceDuration" type="number">
                            <span class="service-modal-input-suffix">мин</span>
                        </div>
                    </label>
                    <label>
                        <span class="service-modal-input-title">Интервал между записями</span>
                        <div class="service-modal-input-wrapper">
                            <input id="createServiceInterval" type="number">
                            <span class="service-modal-input-suffix">мин</span>
                        </div>
                    </label>
                </div>

                <div class="service-divider"></div>
                
                <div class="service-modal-buttons">
                    <button id="saveCreateServiceBtn" class="service-modal-btn">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <button id="createServiceBtn" class="create-service-btn">
        <span></span>
        <span></span>
    </button>

    <div class="background-circles">
        <div class="circle-left"></div>
        <div class="circle-right"></div>
    </div>
</div>
{{end}}

{{define "services_extra_scripts"}}
<script src="/static/js/api/auth.js"></script>
<script src="/static/js/api/offer.js"></script>
<script src="/static/js/api/booking.js"></script>
<script src="/static/js/services.js" defer></script>
<script src="/static/js/header.js" defer></script>
{{end}}
