{{define "reset_extra_head"}}
<link rel="stylesheet" href="/static/css/reset.css">
{{end}}

{{define "reset_content"}}
<div class="reset-container">
    <div class="reset-card">
        <form id="resetForm" novalidate>
            <h1 class="reset-title">Новый пароль</h1>
            <p class="reset-hint">Придумайте новый пароль для вашего аккаунта</p>
            <input type="hidden" id="resetToken" value="{{.reset_token}}">
            <div class="form-group">
                <label class="form-label" for="resetPassword">Новый пароль</label>
                <div class="password-wrapper">
                    <input type="password" id="resetPassword" class="form-input" placeholder="••••••••" autocomplete="new-password">
                    <button type="button" class="password-toggle" tabindex="-1">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3 12C3 12 6.27273 5 12 5C17.7273 5 21 12 21 12C21 12 17.7273 19 12 19C6.27273 19 3 12 3 12Z" stroke-width="2" stroke-linejoin="round"/>
                            <path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" stroke-width="2"/>
                        </svg>
                    </button>
                </div>
            </div>
            <button type="button" class="submit-btn" id="resetBtn">Сохранить пароль</button>
        </form>
    </div>
</div>
{{end}}

{{define "reset_extra_scripts"}}
<script src="/static/js/api/auth.js"></script>
<script src="/static/js/reset.js"></script>
{{end}}
